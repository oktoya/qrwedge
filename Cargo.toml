[package]
name = "qrwedge"
version = "1.0.0"
edition = "2024"
authors = ["OKTO"]
description = "Webcam QR/barcode keyboard wedge"

[[bin]]
name = "QRWedge"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3"

[dependencies]
minifb = { version = "0.29.0", default-features = false }
# 기본 MJPEG 해독(mozjpeg)은 C 라이브러리라 끄고 zune-jpeg로 직접 푼다
nokhwa = { version = "0.10.11", default-features = false, features = ["input-native"] }
rxing = { version = "0.9.3", default-features = false, features = ["decoders", "full_barcode_format_support", "encoding_rs"] }
zune-jpeg = "0.4"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_Debug", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Ime","Win32_Foundation"] }

[target."cfg(target_os = \"macos\")".dependencies]
enigo = { version = "0.6.1", default-features = false }
# minifb 0.29 build.rs가 "-macos"만 확인해 "aarch64-apple-darwin"에서 멈춘다.
# x11 기능을 켜면 그 검사만 통과한다 (x11 코드·의존성은 리눅스 전용이라 맥 빌드에 안 들어감)
minifb = { version = "0.29.0", default-features = false, features = ["x11"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
